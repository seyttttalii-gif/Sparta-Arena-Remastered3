name: Sparta Arena Remastered - Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Godot ile Windows EXE oluştur
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Godot ve Windows dışa aktarma şablonlarını kur
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Godot kurulumunu doğrula
        run: |
          set -euo pipefail
          echo "Godot komutu:"
          command -v godot
          godot --headless --version
          echo "Windows export template dosyaları (tanı amaçlı):"
          APPDATA_UNIX="$(cygpath -u "$APPDATA")"
          find "$APPDATA_UNIX/Godot/export_templates" -type f -iname 'windows_release_x86_64.exe' -print 2>/dev/null || true

      - name: Proje ZIP dosyasını aç ve projeyi bul
        run: |
          set -euo pipefail
          ARCHIVE="SpartaArenaRemastered_FullMigration.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Depo kökündeki ZIP dosyaları:"
            find . -maxdepth 2 -type f -iname '*.zip' -print || true
            echo "HATA: $ARCHIVE depo kökünde bulunamadı."
            exit 1
          fi

          rm -rf unpacked
          mkdir -p unpacked diagnostics
          unzip -q "$ARCHIVE" -d unpacked

          PROJECT_FILE="$(find unpacked -type f -name 'project.godot' -print -quit)"
          if [[ -z "$PROJECT_FILE" ]]; then
            echo "HATA: ZIP içinde project.godot bulunamadı."
            find unpacked -maxdepth 4 -type f -print | head -80 || true
            exit 1
          fi

          PROJECT_REL_DIR="$(dirname "$PROJECT_FILE")"
          PROJECT_ABS_DIR="$(cd "$PROJECT_REL_DIR" && pwd -P)"
          PROJECT_ABS_DIR_WIN="$(cygpath -aw "$PROJECT_ABS_DIR")"
          echo "Proje dosyası: $PROJECT_FILE"
          echo "Proje mutlak yolu: $PROJECT_ABS_DIR_WIN"
          echo "PROJECT_REL_DIR=$PROJECT_REL_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_ABS_DIR_WIN=$PROJECT_ABS_DIR_WIN" >> "$GITHUB_ENV"

      - name: Godot kaynaklarını içe aktar
        run: |
          set -uo pipefail
          echo "Kaynaklar içe aktarılıyor. Günlük: diagnostics/godot-import.log"
          set +e
          godot --headless --verbose --editor --path "$PROJECT_ABS_DIR_WIN" --import --quit 2>&1 | tee diagnostics/godot-import.log
          IMPORT_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Godot içe aktarma çıkış kodu: $IMPORT_EXIT_CODE"
          if [[ "$IMPORT_EXIT_CODE" -ne 0 ]]; then
            echo "HATA: Godot içe aktarma başarısız oldu. diagnostics/godot-import.log dosyasını incele."
            exit "$IMPORT_EXIT_CODE"
          fi

      - name: Godot açılış testi ve GDScript hatalarını kontrol et
        run: |
          set -uo pipefail
          echo "Ana sahne kontrol ediliyor. Günlük: diagnostics/godot-runtime.log"
          set +e
          godot --headless --verbose --path "$PROJECT_ABS_DIR_WIN" --quit-after 3 2>&1 | tee diagnostics/godot-runtime.log
          RUNTIME_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Godot açılış testi çıkış kodu: $RUNTIME_EXIT_CODE"
          if [[ "$RUNTIME_EXIT_CODE" -ne 0 ]]; then
            echo "HATA: Godot açılış testi başarısız oldu. diagnostics/godot-runtime.log dosyasını incele."
            exit "$RUNTIME_EXIT_CODE"
          fi
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Could not parse script' diagnostics/godot-runtime.log; then
            echo "HATA: Günlükte GDScript ayrıştırma/yükleme hatası bulundu."
            exit 1
          fi

      - name: Windows EXE oluştur
        run: |
          set -uo pipefail
          # Proje yolunu tekrar Bash/Git for Windows biçimine çevir ve çıktı klasörünü oluştur.
          PROJECT_ABS_DIR_UNIX="$(cygpath -u "$PROJECT_ABS_DIR_WIN")"
          BUILD_DIR_UNIX="$PROJECT_ABS_DIR_UNIX/build"
          mkdir -p "$BUILD_DIR_UNIX" diagnostics
          EXE_PATH_UNIX="$BUILD_DIR_UNIX/SpartaArenaRemastered.exe"
          EXE_PATH_WIN="$(cygpath -aw "$EXE_PATH_UNIX")"
          echo "Proje: $PROJECT_ABS_DIR_WIN"
          echo "EXE çıktı yolu: $EXE_PATH_WIN"
          echo "Windows dışa aktarma başlatılıyor. Günlük: diagnostics/godot-export.log"
          set +e
          godot --headless --verbose --path "$PROJECT_ABS_DIR_WIN" --export-release "Windows Desktop" "$EXE_PATH_WIN" 2>&1 | tee diagnostics/godot-export.log
          EXPORT_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Godot dışa aktarma çıkış kodu: $EXPORT_EXIT_CODE"
          if [[ "$EXPORT_EXIT_CODE" -ne 0 || ! -f "$EXE_PATH_UNIX" ]]; then
            echo "HATA: Windows EXE oluşturulamadı. diagnostics/godot-export.log dosyasını incele."
            echo "Oluşturma klasörünün içeriği:"
            ls -la "$BUILD_DIR_UNIX" || true
            exit 1
          fi
          echo "EXE oluşturuldu: $EXE_PATH_UNIX"

      - name: Derleme günlüklerini hata olsa bile yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Remastered-Build-Logs
          path: diagnostics/*.log
          if-no-files-found: ignore

      - name: Windows EXE dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Remastered-Windows
          path: unpacked/**/build/SpartaArenaRemastered.exe
          if-no-files-found: error
